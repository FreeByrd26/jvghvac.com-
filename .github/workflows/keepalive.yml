name: Supabase keep-alive

# Free-tier Supabase projects auto-pause after ~7 idle days. While paused,
# website leads can't save to the Hit List. An anonymous READ ping proved
# not to count as activity, so this performs a real WRITE (updating a single
# heartbeat row) every day — a write can't be cached or skipped, so it keeps
# the database genuinely active. Runs on GitHub's free Actions minutes.

on:
  schedule:
    - cron: "0 11 * * *"   # every day at 11:00 UTC
  workflow_dispatch: {}      # allow a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write heartbeat to the JVG database
        run: |
          KEY="sb_publishable_B1lxGQ4zQ0LNUy4LXin1Ow_9UIAYAHt"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PATCH "https://zsaasblsmjguacebjetr.supabase.co/rest/v1/heartbeat?id=eq.1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"last_ping\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}")
          echo "Supabase heartbeat write responded: $CODE"
          # 204 = write accepted (project awake). Anything else is a problem.
          if [ "$CODE" != "204" ]; then
            echo "::warning::Unexpected status $CODE — the project may be paused or the heartbeat row/policy is missing."
            exit 1
          fi
